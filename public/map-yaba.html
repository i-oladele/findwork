<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E7E2D8; }
  #map { position: absolute; inset: 0; }
  .leaflet-control-attribution { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 9px; }
  .fw-pin { display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .fw-rider { width: 34px; height: 34px; background: #F04E2A; box-shadow: 0 0 0 8px rgba(240,78,42,.22); }
  .fw-home { width: 26px; height: 26px; background: #17130E; }
  .fw-pin svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var home = [6.5095, 3.3711];
  var rider = [6.5163, 3.3607];
  var map = L.map('map', {
    center: [6.5128, 3.3660],
    zoom: 15,
    zoomControl: false,
    attributionControl: true
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  L.polyline([rider, [6.5150, 3.3648], [6.5121, 3.3672], [6.5104, 3.3695], home], {
    color: '#F04E2A', weight: 5, opacity: .95, lineCap: 'round'
  }).addTo(map);

  var bike = '<svg viewBox="0 0 256 256"><path d="M208 96h-20.7l-14-38.4A16 16 0 0 0 158.3 47H128a8 8 0 0 0 0 16h30.3l8.7 24H96a48 48 0 0 0-46 34.7A40 40 0 1 0 56 200a40 40 0 0 0 39.2-32h49.6a40 40 0 1 0 63.2-40Zm-152 88a24 24 0 1 1 24-24 24 24 0 0 1-24 24Zm39.2-40a40 40 0 0 0-30.6-31.3A32 32 0 0 1 96 103h76.5l6.2 17a40 40 0 0 0-24.4 24Zm112.8 40a24 24 0 1 1 24-24 24 24 0 0 1-24 24Z"/></svg>';
  var house = '<svg viewBox="0 0 256 256"><path d="M219.3 108.4 139.3 35a16 16 0 0 0-22.6 0l-80 73.4A16 16 0 0 0 32 120v96a8 8 0 0 0 8 8h176a8 8 0 0 0 8-8v-96a16 16 0 0 0-4.7-11.6Z"/></svg>';

  L.marker(rider, { icon: L.divIcon({ className: '', html: '<div class="fw-pin fw-rider">' + bike + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map);
  L.marker(home, { icon: L.divIcon({ className: '', html: '<div class="fw-pin fw-home">' + house + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map);
</script>
</body>
</html>
